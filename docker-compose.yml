services:
  backend:
    image: blackdark93/palworld-save-pal-editor:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
      # Change this to the URL of your public server
      - PUBLIC_WS_URL=127.0.0.1:5174/ws
    ports:
      - "5174:5174"
    volumes:
      - ./data:/app/data
      - ./palworld_save_pal:/app/palworld_save_pal
      - ./persistent:/app/persistent  # Persistent data directory
      - ./psp.db:/app/psp.db  # Persist database at default location (file must exist first!)
    environment:
      - PORT=5174
      # PSP_DB_PATH defaults to psp.db in working directory (/app/psp.db)
      # To use persistent directory instead, uncomment:
      # - PSP_DB_PATH=/app/persistent/psp.db
    command: python psp.py
